  <line x1="60" y1="60" x2="60" y2="40" stroke="#059669" stroke-width="6" stroke-linecap="round" />
  <line x1="340" y1="60" x2="340" y2="40" stroke="#059669" stroke-width="6" stroke-linecap="round" />

