name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Commit message template (PR commits)
        if: github.event_name == 'pull_request'
        run: npm run check:commits -- "origin/${{ github.base_ref }}..HEAD"

      - name: Commit message template (last 50 on main)
        if: github.event_name == 'push'
        run: npm run check:commits:history

      - name: LF line endings
        run: npm run check:eol

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Test with coverage
        run: npm run test:cov

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm run audit

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    container:
      image: zricethezav/gitleaks:latest
      options: --entrypoint ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Scan full repository history
        # Runs the gitleaks CLI directly against the whole history instead of
        # gitleaks-action's before/after push diffing, which breaks with a
        # git "unrelated histories" error after any force-push or rebase.
        run: gitleaks detect --source . --redact --exit-code 2 --verbose
